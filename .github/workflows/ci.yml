name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Format, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # 자격 증명이 있으면 TMDB를 실제로 호출하는 테스트까지 함께 돕니다.
      # 포크에서 올라온 PR에는 시크릿이 내려오지 않아 값이 비는데, 그때는 해당
      # 테스트만 건너뛰고 나머지는 그대로 통과합니다.
      - name: Test
        run: pnpm test
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

      # 릴리스와 같은 조건으로 빌드해 자격 증명을 심는 경로까지 함께 돌립니다.
      # 여기서 나온 번들은 배포되지 않고 버려집니다. 포크에서 올라온 PR에는
      # 시크릿이 내려오지 않아 값이 비는데, 그때는 심지 않은 빌드가 나오고
      # 그것도 정상입니다 — 그래서 여기서는 심겼는지 검사하지 않습니다.
      - name: Build
        run: pnpm build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

      # 번들이 실제로 로드되는지 봅니다. 타입 검사와 테스트는 소스를 보지만 CJS
      # 출력은 별도 변환을 한 번 더 거쳐서, 소스가 멀쩡해도 `dist/*.cjs`만 깨질 수
      # 있습니다. 그건 설치한 쪽에서야 드러납니다.
      - name: Smoke test the built bundles
        run: |
          node -e "require('./dist/index.cjs')"
          node -e "import('./dist/index.js')"
          node dist/cli.js
          node dist/server.js < /dev/null
