name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish & Deploy
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 배포되는 번들에 TMDB 자격 증명을 심습니다. 이러면 `npx @julong/mcp-kit`를
      # 쓰는 쪽이 클라이언트 설정에 키를 넣지 않아도 영화 도구가 바로 돕니다.
      #
      # 심은 값은 AES-256-GCM으로 봉해 넣지만 여는 열쇠가 같은 번들에 들어가므로,
      # 이 패키지를 설치한 사람은 누구나 키를 되찾을 수 있습니다. 여기 쓰는 키는
      # 그 전제를 받아들인 전용 키여야 하고, 남용이 보이면 TMDB에서 발급을 다시
      # 받아 시크릿만 갈아 끼우면 다음 릴리스부터 반영됩니다.
      - name: Build
        run: pnpm build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

      # 시크릿 이름이 바뀌거나 지워지면 빌드는 조용히 성공하고 자격 증명만 빠진
      # 패키지가 올라갑니다. 그건 설치한 쪽에서야 드러나므로 여기서 막습니다.
      - name: Verify the credential made it into the bundle
        run: |
          node -e "
            const { hasEmbeddedCredentials } = require('./dist/index.cjs');
            if (!hasEmbeddedCredentials()) {
              console.error('No TMDB credential in the bundle — check the TMDB_API_KEY secret');
              process.exit(1);
            }
            console.log('TMDB credential embedded');
          "

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload SKILL.md assets to release
        run: |
          tag='${{ needs.release-please.outputs.tag_name }}'
          for skill in skills/*/SKILL.md; do
            [ -f "$skill" ] || continue
            echo "Uploading $skill for $tag"
            gh release upload "$tag" "$skill" --clobber || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docs
        run: pnpm docs:build

      - name: Deploy to Netlify
        run: |
          pnpm netlify deploy \
            --prod \
            --site=${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NFP_TOKEN }}
